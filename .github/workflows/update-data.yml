name: Spor Toto verilerini guncelle

on:
  workflow_dispatch:
  push:
    paths:
      - "data/coupon.csv"
      - "data/predictions.csv"
      - "data/consensus.csv"
      - "scripts/fetch_data.py"
      - "scripts/apply_decision_policy.py"
      - ".github/workflows/update-data.yml"
      - "docs/index.html"
      - "docs/DECISION_POLICY.md"
  schedule:
    # Sabah degerlendirmesi her gun calisir: pazartesi eski kupon, sali yeni kupon.
    - cron: "0 8 * * *"
      timezone: "Europe/Istanbul"
    # Pazartesi aksami yeni kuponu erken degerlendirmemek icin 18:00 calismasi yoktur.
    - cron: "0 18 * * 0,2-6"
      timezone: "Europe/Istanbul"

permissions:
  contents: write
  pages: write
  id-token: write

# Veri saglayici anahtari repository genelinde ortaktir. Tum dal ve manuel
# calistirmalari siraya alarak ayni anda API istegi gonderilmesini engelle.
concurrency:
  group: sportoto-provider-api
  cancel-in-progress: false

jobs:
  update-and-build:
    # Pazartesi liste botunun push'u modeli hemen tetiklemesin; manuel push'lar calisir.
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v6
      - name: Python'u hazirla
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt
      - name: Saglayici verileriyle kupon modelini hazirla
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python scripts/fetch_data.py
          python scripts/apply_decision_policy.py
      - name: Yeni verileri repository'ye kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "Verileri otomatik guncelle"
          git push
      - name: GitHub Pages'i hazirla
        uses: actions/configure-pages@v5
      - name: Site dosyalarini paketle
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-and-build
    steps:
      - name: Siteyi yayinla
        id: deployment
        uses: actions/deploy-pages@v4
