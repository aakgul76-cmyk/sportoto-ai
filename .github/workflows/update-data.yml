name: Spor Toto verilerini guncelle

on:
  workflow_dispatch:
  push:
    paths:
      - "data/coupon.csv"
      - "data/predictions.csv"
      - "scripts/fetch_data.py"
      - ".github/workflows/update-data.yml"
      - "docs/index.html"
  schedule:
    - cron: "0 8,18 * * *"
      timezone: "Europe/Istanbul"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sportoto-data-and-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v6
      - name: Python'u hazirla
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt
      - name: Football-Data gecmisinden kupon modelini hazirla
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/fetch_data.py
      - name: Yeni verileri repository'ye kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "Verileri otomatik guncelle"
          git push
      - name: GitHub Pages'i hazirla
        uses: actions/configure-pages@v5
      - name: Site dosyalarini paketle
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-and-build
    steps:
      - name: Siteyi yayinla
        id: deployment
        uses: actions/deploy-pages@v4
