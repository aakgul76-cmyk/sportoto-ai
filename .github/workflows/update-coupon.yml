name: Haftalik Spor Toto listesini guncelle

on:
  workflow_dispatch:
  schedule:
    - cron: "15 12,18 * * 1"
      timezone: "Europe/Istanbul"

permissions:
  contents: write

concurrency:
  group: sportoto-provider-api
  cancel-in-progress: false

jobs:
  update-weekly-coupon:
    runs-on: ubuntu-latest
    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v6
      - name: Python'u hazirla
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt
      - name: Yeni 15 maclik listeyi dogrula
        run: |
          python scripts/update_coupon.py
          python scripts/reset_consensus.py
      - name: Dogrulanmis listeyi kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/coupon.csv data/predictions.csv data/consensus.csv data/external_predictions.csv
          git diff --cached --quiet || git commit -m "Yeni haftanin Spor Toto listesini otomatik kaydet"
          git push
