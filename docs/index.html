<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spor Toto Analiz</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; background: #07140f; color: #edf7f1; }
    main { width: min(1040px, calc(100% - 32px)); margin: 48px auto; }
    header { margin-bottom: 28px; }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 6vw, 3.5rem); }
    .accent { color: #5ee28c; }
    #status, #coverage, #policy { color: #a9bdb1; line-height: 1.5; }
    .grid { display: grid; gap: 14px; }
    article { background: #10241a; border: 1px solid #254735; border-radius: 16px; padding: 18px; }
    .teams { display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: 1.1rem; font-weight: 700; }
    .versus { color: #5ee28c; font-size: .8rem; }
    .meta { margin-top: 12px; color: #a9bdb1; font-size: .9rem; }
    .picks, .metrics { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .pick, .metric { border-radius: 999px; padding: 7px 11px; font-size: .86rem; font-weight: 700; }
    .wide { background: #1d4f35; color: #a8f0c1; }
    .narrow { background: #3b3320; color: #ffe08a; }
    .model { background: #17324a; color: #9fd3ff; }
    .risk { background: #4a1f1f; color: #ffb5b5; }
    .ready { background: #183e28; color: #9cf0b8; }
    .pending { background: #4a351f; color: #ffd39a; }
    .match-no { color: #5ee28c; margin-right: 8px; }
    .reason { margin-top: 12px; color: #d2e6da; font-size: .92rem; line-height: 1.45; }
    .origin { margin-top: 8px; color: #a9bdb1; font-size: .82rem; }
    .empty { text-align: center; padding: 48px 20px; color: #a9bdb1; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Spor Toto <span class="accent">Analiz</span></h1>
      <div id="status">Veriler yükleniyor…</div>
      <div id="coverage"></div>
      <div id="policy"></div>
    </header>
    <section id="matches" class="grid"></section>
  </main>
  <script>
    const escapeHtml = (value) => String(value ?? "-").replace(/[&<>'"]/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
    })[char]);
    const pct = (obj, key) => obj && obj[key] !== undefined ? `${obj[key]}%` : "-";

    async function loadMatches() {
      const status = document.querySelector("#status");
      const coverage = document.querySelector("#coverage");
      const policy = document.querySelector("#policy");
      const container = document.querySelector("#matches");
      try {
        const response = await fetch("data/matches.json", { cache: "no-store" });
        if (!response.ok) throw new Error("Veri dosyası okunamadı");
        const data = await response.json();
        status.textContent = data.generated_at
          ? `Son güncelleme: ${new Date(data.generated_at).toLocaleString("tr-TR", { timeZone: data.timezone })} · Dar gerçek: ${data.narrow_columns ?? "-"} kolon · Geniş sanal: ${data.wide_columns ?? "-"} kolon`
          : "Henüz API verisi alınmadı.";
        const modelCoverage = data.model_coverage || {};
        const decisionCoverage = data.decision_coverage || {};
        coverage.textContent = `Maç bazlı durum: Model ${modelCoverage.ready_count ?? "-"}/${modelCoverage.total_matches ?? data.count ?? 15} · Karar ${decisionCoverage.ready_count ?? "-"}/${decisionCoverage.total_matches ?? data.count ?? 15} · Bekleyen maçlar: ${(decisionCoverage.incomplete_match_nos || modelCoverage.unavailable_match_nos || []).join(", ") || "yok"}`;
        policy.textContent = `Politika: ${data.decision_policy?.name ?? "-"} · Öncelik: Dar kupon · Geniş rolü: sanal +ihtimal kontrolü`;
        const balance = data.wide_strategy?.portfolio_audit;
        if (balance?.audit_complete) {
          policy.textContent += ` · Beklenen 1-X-2: ${balance.expected_result_counts?.["1"] ?? "-"}-${balance.expected_result_counts?.X ?? "-"}-${balance.expected_result_counts?.["2"] ?? "-"} · Kapsama: ${balance.coverage_counts?.["1"] ?? "-"}-${balance.coverage_counts?.X ?? "-"}-${balance.coverage_counts?.["2"] ?? "-"}${balance.imbalance_alarm ? " · DAĞILIM ALARMI" : ""}`;
        }

        if (!data.matches?.length) {
          container.innerHTML = '<div class="empty">İlk GitHub Actions çalışmasından sonra maçlar burada görünecek.</div>';
          return;
        }

        container.innerHTML = data.matches.map(match => {
          const decision = match.decision || {};
          const model = match.model_1x2 || {};
          const h2h = match.model_sample?.h2h || {};
          const form = match.model_sample?.recent_form || {};
          const riskReason = decision.favorite_risk_reason || decision.reason || "-";
          const modelReady = match.model_status === "ready";
          const decisionReady = ["ready", "manual_ready"].includes(match.decision_status);
          return `
          <article>
            <div class="teams">
              <span><b class="match-no">${escapeHtml(match.match_no || match.fixture_id)}.</b>${escapeHtml(match.home)}</span>
              <span class="versus">VS</span>
              <span>${escapeHtml(match.away)}</span>
            </div>
            <div class="meta">
              ${escapeHtml(match.league)} · ${new Date(match.date).toLocaleString("tr-TR", { timeZone: data.timezone })}
            </div>
            <div class="picks">
              <span class="pick narrow">Dar gerçek: ${escapeHtml(match.narrow_pick || "-")}</span>
              <span class="pick wide">Geniş sanal: ${escapeHtml(match.wide_pick || "-")}</span>
              <span class="pick model">Model: 1 ${escapeHtml(pct(model, "1"))} · X ${escapeHtml(pct(model, "X"))} · 2 ${escapeHtml(pct(model, "2"))}</span>
            </div>
            <div class="metrics">
              <span class="metric ${modelReady ? "ready" : "pending"}">Model durumu: ${modelReady ? "hazır" : "veri yok"}</span>
              <span class="metric ${decisionReady ? "ready" : "pending"}">Karar durumu: ${decisionReady ? "hazır" : "bekliyor"}</span>
              <span class="metric model">Tek adayı: ${escapeHtml(decision.model_single || "-")}</span>
              <span class="metric model">Çift adayı: ${escapeHtml(decision.model_double || "-")}</span>
              <span class="metric risk">Sürpriz: ${escapeHtml(decision.surprise_score ?? "-")}</span>
              <span class="metric risk">Güven: ${escapeHtml(decision.confidence_class || "-")}</span>
            </div>
            <div class="reason">Favori risk nedeni: ${escapeHtml(riskReason)}</div>
            <div class="origin">Form (son 5): ev ${escapeHtml(form.home?.points ?? "-")} puan · deplasman ${escapeHtml(form.away?.points ?? "-")} puan · H2H: ${escapeHtml(h2h.matches ?? 0)} maç (${escapeHtml(h2h.home_side_wins ?? 0)}-${escapeHtml(h2h.draws ?? 0)}-${escapeHtml(h2h.away_side_wins ?? 0)})</div>
            <div class="origin">Dar kaynak: ${escapeHtml(match.narrow_pick_origin || (match.manual_narrow_pick ? "manual" : "-"))} · Geniş kaynak: ${escapeHtml(match.wide_pick_origin || "-")}</div>
            <div class="origin">Genişe ekleme nedeni: ${escapeHtml(match.wide_extra_reason || "-")}</div>
          </article>`;
        }).join("");
      } catch (error) {
        status.textContent = "Veri yüklenemedi.";
        container.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
      }
    }
    loadMatches();
  </script>
</body>
</html>
